<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Astro Fighters — Phaser Paper-Doll Package 01</title>
<style>
html,body,#game{margin:0;width:100%;height:100%;border:0;background:#0d0f10;overflow:hidden}
#game{display:block}
#status{position:fixed;z-index:3;left:8px;top:8px;padding:6px 8px;background:#141410;color:#F5D5BB;border:1px solid #756A55;font:10px/1.35 ui-monospace,monospace;pointer-events:none}
</style>
</head>
<body>
<div id="status">PHASER PACKAGE 01 · reference-derived engineering candidate · not art-approved</div>
<iframe id="game" src="index.html" allow="fullscreen"></iframe>
<script>
(() => {
  const frame = document.getElementById("game");
  frame.addEventListener("load", () => {
    const d = frame.contentDocument;
    if (!d || !d.body) return;
    frame.contentWindow.AF_PAPERDOLL_PACKAGE01_REPLACE = true;
    const s = d.createElement("script");
    s.src = "js/paperdoll-package01-bridge.js";
    s.defer = true;
    d.body.appendChild(s);
  });
})();
</script>
</body>
</html>
