<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Astro Fighters — Phaser Paper-Doll Package 01</title>
<style>
html,body,#game{margin:0;width:100%;height:100%;border:0;background:#0d0f10;overflow:hidden}
#game{display:block}
#status{position:fixed;z-index:3;left:8px;top:8px;padding:6px 8px;background:#141410;color:#F5D5BB;border:1px solid #756A55;font:10px/1.35 ui-monospace,monospace;pointer-events:none}
</style>
</head>
<body>
<div id="status">PHASER PACKAGE 01 · reference-derived engineering candidate · not art-approved</div>
<iframe id="game" src="index.html" allow="fullscreen"></iframe>
<script>
(() => {
  const frame = document.getElementById("game");
  frame.addEventListener("load", () => {
    const d = frame.contentDocument;
    if (!d || !d.body) return;
    frame.contentWindow.AF_PAPERDOLL_PACKAGE01_REPLACE = true;
    const chunks = ["js/pd01-atlas-chunks/00.js","js/pd01-atlas-chunks/01.js","js/pd01-atlas-chunks/02.js","js/pd01-atlas-chunks/03.js","js/pd01-atlas-chunks/04.js","js/pd01-atlas-chunks/05.js","js/pd01-atlas-chunks/06.js","js/pd01-atlas-chunks/07.js"];
    const load = (urls, done) => {
      if (!urls.length) return done();
      const s = d.createElement("script");
      s.src = urls[0];
      s.onload = () => load(urls.slice(1), done);
      d.body.appendChild(s);
    };
    load(chunks, () => {
      const s = d.createElement("script");
      s.src = "js/paperdoll-package01-bridge.js";
      s.defer = true;
      d.body.appendChild(s);
    });
  });
})();
</script>
</body>
</html>
