<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Astro Fighters Playtest v4</title><style>html,body,#game{margin:0;width:100%;height:100%;border:0;background:#0d0f10;overflow:hidden}#game{display:block}</style></head><body><iframe id="game" src="index.html" allow="fullscreen"></iframe><script>
(()=>{
 const frame=document.getElementById('game');
 frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  const patch=d.createElement('script');
  patch.textContent=`(()=>{
   const $=id=>document.getElementById(id);
   // Remove the old birthplace input listeners by replacing the input node.
   const old=$('birth-place');if(old){const input=old.cloneNode(true);old.replaceWith(input);$('birth-place-results')?.remove();document.querySelector('.birth-place-search-status')?.remove();
    input.placeholder='Search city, town, or postal code';
    const wrap=document.createElement('div');wrap.style.cssText='display:grid;grid-template-columns:1fr auto;gap:6px';input.parentElement.insertBefore(wrap,input);wrap.appendChild(input);
    const btn=document.createElement('button');btn.type='button';btn.textContent='Search';btn.style.cssText='padding:7px 12px';wrap.appendChild(btn);
    const results=document.createElement('div');results.style.cssText='display:none;margin-top:6px;border:1px solid #5b5144;background:#121416;max-height:210px;overflow:auto;position:relative;z-index:130';wrap.insertAdjacentElement('afterend',results);
    const status=document.createElement('div');status.style.cssText='margin-top:5px;font:10px/1.35 ui-monospace,monospace;color:#9e9585;text-transform:none;letter-spacing:0';status.textContent='Search a birthplace to fill coordinates and timezone.';results.insertAdjacentElement('afterend',status);
    let seq=0,timer=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=r=>r.label||[r.name,r.admin1,r.country].filter(Boolean).join(', ');
    const close=()=>{results.style.display='none'};
    async function run(){clearTimeout(timer);const q=input.value.trim(),my=++seq;if(q.length<2){close();status.textContent='Enter at least 2 characters.';return}status.textContent='Searching locations…';status.style.color='#9bc3cd';try{if(typeof AF_ASTRO==='undefined'||typeof AF_ASTRO.searchPlaces!=='function')throw new Error('Natal geocoder unavailable');const rows=await AF_ASTRO.searchPlaces(q);if(my!==seq)return;results.innerHTML='';if(!rows.length){close();status.style.color='#d5ad68';status.textContent='No matching location found. Manual coordinates and timezone still work.';return}for(const r of rows){const b=document.createElement('button');b.type='button';b.style.cssText='display:block;width:100%;border:0;border-bottom:1px solid #38342e;background:#16191b;color:#eadfc8;padding:9px 10px;text-align:left';b.innerHTML='<b style="display:block;color:#efd39d">'+esc(label(r))+'</b><small style="display:block;color:#9e9585">'+esc([r.admin1,r.country,r.timezone].filter(Boolean).join(' · '))+' · '+Number(r.latitude).toFixed(4)+', '+Number(r.longitude).toFixed(4)+'</small>';b.onclick=()=>{input.value=label(r);$('birth-lat').value=Number(r.latitude).toFixed(4);$('birth-lon').value=Number(r.longitude).toFixed(4);$('birth-tz').value=r.timezone||'UTC';status.style.color='#8fb28f';status.textContent='Selected '+label(r)+' · '+$('birth-lat').value+', '+$('birth-lon').value+' · '+$('birth-tz').value;close()};results.appendChild(b)}results.style.display='block';status.style.color='#8fb28f';status.textContent='Choose a result.'}catch(e){close();status.style.color='#d78d7e';status.textContent='Location search failed. Manual coordinates and timezone still work.';console.warn(e)}}
    btn.onclick=run;input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run()}});input.addEventListener('input',()=>{clearTimeout(timer);close();if(input.value.trim().length>=3)timer=setTimeout(run,450)});
   }
   // Exact master-palette families used for creator selection.
   const F={skin_e:['#291011','#3C1B17','#4F291E','#623A24','#754C2B','#885D33','#9A703C','#AD8346'],skin_f:['#1F0C0B','#2E1510','#3E2115','#4E2F19','#5D3E1E','#6D4D25','#7D5D2C','#8C6D33'],timber:['#292918','#464228','#645838','#816A47','#9F7C57','#BC9069','#DAA37C','#F7B690','#191A12','#343224','#4E4836','#685B47','#826E59','#9D836D','#B79881','#D1AC96'],rust:['#14120A','#2E2516','#473522','#61412C','#7A4D38','#945B45','#AD6754','#C77463'],cloth:['#141A16','#29342B','#3E4F3E','#556A51','#6D8566','#86A07C','#9FBB93','#BAD6AA'],cedar:['#0B1414','#1A302A','#294C3B','#366746','#458350','#559F5D','#67BB6A','#7BD678'],tide:['#10151F','#1F2C3D','#2E475B','#3B6779','#4A8998','#5BACB6','#6DD2D4','#80F2EB'],verm:['#24180C','#422715','#5F311D','#7D3524','#9B382D','#B93B38','#D7444B','#F55165'],trimA:['#0F111F','#1D243C','#2A3B5A','#375678','#457396','#5491B4','#65B1D2','#77D3F0'],trimB:['#1C1F0E','#3C3D1B','#5B5628','#796A34','#987E41','#B69350','#D4A75F','#F2B970'],trimC:['#1F101C','#3C1E39','#572C59','#6C3976','#7F4893','#9258B0','#A369CD','#B37AEB'],fire:['#332509','#50340C','#6D3D0E','#8A420F','#A84212','#C53E1A','#E23622','#FF2C2B'],earth:['#162410','#2C401C','#485D27','#687931','#8B953D','#ABB24B','#CDCE5A','#EBE469'],air:['#313847','#414F62','#51677C','#618096','#729AB0','#85B5CB','#99D0E5','#AEEBFF'],water:['#0E0E1F','#1A1E3D','#26335B','#314B79','#3E6798','#4D83B6','#5CA3D4','#6DC4F2'],yin:['#0B070F','#191127','#251A3F','#2E2257','#332B6F','#373788','#434DA0','#5067B8'],yang:['#4C4C23','#66612D','#807336','#99833F','#B29349','#CCA457','#E5B566','#FFC676'],spirit:['#1D3538','#295453','#366F68','#418B7A','#4EA78A','#5EC39C','#6EDEAD','#7FFABD'],patina:['#0D1A18','#1B3720','#415528','#736335','#915E42','#AF6C53','#CD7A64','#EB8676'],ui:['#141410','#343427','#55503E','#756A55','#95846C','#B59F85','#D5BAA0','#F5D5BB']};const flat=(...a)=>a.flatMap(k=>F[k]);
   const sets={'eye-color':[flat('trimA','trimC','air','water','yin','spirit'),'#5CA3D4'],'hair-color':[flat('skin_e','skin_f','timber','rust','patina','ui'),'#3C1B17'],'inner-color':[flat('cloth','cedar','tide','verm','trimA','trimB','trimC','fire','earth','air','water','yin','yang','spirit','patina','ui'),'#B8CD63'],'outer-color':[flat('cloth','cedar','tide','verm','trimA','trimB','trimC','fire','earth','air','water','yin','yang','spirit','patina','ui'),'#3B6779'],'pants-color':[flat('cloth','ui','yin','earth'),'#343427'],'shoes-color':[flat('timber','rust','ui'),'#756A55']};
   for(const [id,[colors,fallback]] of Object.entries(sets)){const input=$(id);if(!input)continue;input.type='hidden';const label=input.closest('label');if(!label)continue;label.querySelector('.af-v4-swatches')?.remove();const wrap=document.createElement('div');wrap.className='af-v4-swatches';wrap.style.cssText='display:grid;grid-template-columns:repeat(8,22px);gap:4px;margin-top:6px;max-height:112px;overflow:auto;padding:5px;background:#111416;border:1px solid #4d453b';label.appendChild(wrap);let current=colors.find(c=>c.toLowerCase()===String(input.value).toLowerCase())||fallback;input.value=current;input.dispatchEvent(new Event('input',{bubbles:true}));for(const c of colors){const b=document.createElement('button');b.type='button';b.style.cssText='width:22px;height:22px;min-width:22px;padding:0;background:'+c+';border:'+(c===current?'2px solid #f0d28c':'1px solid #28231e');b.title=c;b.onclick=()=>{input.value=c;input.dispatchEvent(new Event('input',{bubbles:true}));[...wrap.children].forEach(x=>x.style.border=x===b?'2px solid #f0d28c':'1px solid #28231e')};wrap.appendChild(b)}}
   window.AF_PLAYTEST_V4_PATCHED=true;
  })();`;
  d.body.appendChild(patch);
 });
})();
</script></body></html>
